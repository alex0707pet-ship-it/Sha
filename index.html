<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Замес Онлайн (P2P)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; padding: 20px; margin: 0; }
        .screen { display: none; max-width: 1200px; margin: 0 auto; }
        .screen.active { display: block; }
        h1, h2, h3 { color: #e94560; text-align: center; }
        
        .lobby-box { background: #16213e; padding: 30px; border-radius: 15px; text-align: center; max-width: 500px; margin: 50px auto; }
        input, select, button { padding: 12px; margin: 8px; border-radius: 8px; border: none; font-size: 16px; width: 80%; }
        button { background: #e94560; color: white; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background: #ff2e63; }
        button:disabled { background: #555; cursor: not-allowed; }

        .game-layout { display: grid; grid-template-columns: 1fr 300px; gap: 20px; }
        @media (max-width: 900px) { .game-layout { grid-template-columns: 1fr; } }

        .bases-area { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; }
        .base-card { background: linear-gradient(135deg, #0f3460, #16213e); border: 2px solid #e94560; padding: 15px; border-radius: 12px; width: 220px; cursor: pointer; transition: 0.2s; }
        .base-card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(233, 69, 96, 0.4); }
        .base-card.capturable { border-color: #ffd700; box-shadow: 0 0 15px #ffd700; }
        
        .minion-slot { background: rgba(255,255,255,0.1); padding: 5px; margin: 4px 0; border-radius: 4px; font-size: 12px; display: flex; justify-content: space-between; }
        
        .hand-area { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 20px; min-height: 160px; }
        .card { background: #fff; color: #333; padding: 10px; border-radius: 8px; width: 130px; cursor: pointer; transition: 0.2s; font-size: 12px; text-align: center; position: relative; }
        .card:hover { transform: translateY(-10px); }
        .card.selected { border: 3px solid #ffd700; transform: translateY(-10px); }
        .card-type { position: absolute; top: 5px; right: 5px; font-size: 10px; background: #333; color: #fff; padding: 2px 5px; border-radius: 4px; }

        .sidebar { background: #16213e; padding: 20px; border-radius: 15px; }
        .player-stat { background: rgba(255,255,255,0.05); padding: 10px; margin: 5px 0; border-radius: 8px; border-left: 4px solid #e94560; }
        .player-stat.active { border-left-color: #ffd700; background: rgba(255, 215, 0, 0.1); }
        
        #log { background: #0f3460; padding: 15px; border-radius: 10px; max-height: 250px; overflow-y: auto; font-size: 13px; margin-top: 20px; }
        .log-entry { margin: 4px 0; padding: 6px; border-left: 3px solid #4facfe; background: rgba(255,255,255,0.05); }
        
        .room-code { font-size: 24px; font-weight: bold; color: #ffd700; letter-spacing: 3px; background: #000; padding: 10px; border-radius: 8px; margin: 10px 0; }
    </style>
</head>
<body>

<!-- ЭКРАН ЛОББИ -->
<div id="lobby-screen" class="screen active">
    <div class="lobby-box">
        <h1>🎮 Замес Онлайн</h1>
        <input type="text" id="player-name" placeholder="Ваше имя" value="Игрок 1">
        <button onclick="createGame()">🏆 Создать игру</button>
        <p>— ИЛИ —</p>
        <input type="text" id="room-code-input" placeholder="Код комнаты">
        <button onclick="joinGame()">🚪 Присоединиться</button>
        <div id="lobby-status" style="margin-top: 20px; color: #aaa;"></div>
    </div>
</div>

<!-- ЭКРАН ИГРЫ -->
<div id="game-screen" class="screen">
    <div style="text-align: center; margin-bottom: 10px;">
        <h2>Ход: <span id="current-player-name" style="color: #ffd700;"></span></h2>
        <div id="room-display" style="font-size: 14px; color: #aaa;"></div>
    </div>

    <div class="game-layout">
        <div>
            <div class="bases-area" id="bases-area"></div>
            
            <h3 style="margin-top: 30px;">Ваша рука (<span id="hand-count">0</span> карт):</h3>
            <div class="hand-area" id="hand-area"></div>
            
            <div style="text-align: center; margin-top: 20px;">
                <button onclick="endTurn()" id="btn-end-turn" style="width: auto; padding: 15px 40px; font-size: 18px;">Завершить ход</button>
            </div>
        </div>

        <div class="sidebar">
            <h3>Счет</h3>
            <div id="players-scores"></div>
            <h3 style="margin-top: 20px;">Журнал</h3>
            <div id="log"></div>
        </div>
    </div>
</div>

<!-- ЭКРАН ПОБЕДЫ -->
<div id="victory-screen" class="screen">
    <div class="lobby-box">
        <h1>🏆 ПОБЕДА! 🏆</h1>
        <h2 id="winner-name" style="color: #ffd700;"></h2>
        <div id="final-scores" style="text-align: left; margin: 20px 0;"></div>
        <button onclick="location.reload()">Новая игра</button>
    </div>
</div>

<script>
// === ДАННЫЕ ФРАКЦИЙ (Строго по правилам базового Замеса) ===
const FACTIONS = {
    wizards: { name: 'Волшебники', icon: '🧙', color: '#9b59b6',
        minions: [{n:'Ученик чародея', p:2, a:'Потяни 1 карту', e:'draw', v:1, c:4}, {n:'Чародей', p:3, c:2}, {n:'Архимаг', p:4, a:'Потяни 1 карту', e:'draw', v:1, c:2}, {n:'Великий маг', p:5, a:'Потяни 2 карты', e:'draw', v:2, c:2}],
        actions: [{n:'Магический выстрел', a:'Уничтожь приспешника с силой ≤ 2', e:'destroy', v:2, c:4}, {n:'Телепортация', a:'Перемести своего приспешника', e:'move', v:1, c:4}, {n:'Массовое заклинание', a:'Потяни 2 карты', e:'draw', v:2, c:2}]
    },
    dinosaurs: { name: 'Динозавры', icon: '🦖', color: '#27ae60',
        minions: [{n:'Дромицей', p:2, c:4}, {n:'Стегозавр', p:3, c:2}, {n:'Тираннозавр', p:4, a:'Уничтожь приспешника с силой ≤ 2', e:'destroy', v:2, c:2}, {n:'Тираннозавр с лазером', p:7, c:2}],
        actions: [{n:'Рёв', a:'Уничтожь приспешника с силой ≤ 2', e:'destroy', v:2, c:4}, {n:'Топот', a:'Уничтожь приспешника с силой ≤ 3', e:'destroy', v:3, c:4}, {n:'Лазерный залп', a:'Уничтожь приспешника с силой ≤ 4', e:'destroy', v:4, c:2}]
    },
    zombies: { name: 'Зомби', icon: '🧟', color: '#7f8c8d',
        minions: [{n:'Зомби', p:2, a:'Верни на руку в конце хода', e:'return', v:1, c:4}, {n:'Крикун', p:3, a:'Потяни 1 карту', e:'draw', v:1, c:2}, {n:'Бегун', p:4, a:'Верни на руку в конце хода', e:'return', v:1, c:2}, {n:'Гигантский зомби', p:5, a:'Потяни 1 карту', e:'draw', v:1, c:2}],
        actions: [{n:'Восстание мёртвых', a:'Верни приспешника из сброса на руку', e:'returnDiscard', v:1, c:4}, {n:'Зомби-апокалипсис', a:'Уничтожь приспешника с силой ≤ 2', e:'destroy', v:2, c:4}, {n:'Орда зомби', a:'Потяни 2 карты', e:'draw', v:2, c:2}]
    },
    ninjas: { name: 'Ниндзя', icon: '🥷', color: '#2c3e50',
        minions: [{n:'Ниндзя-ученик', p:2, a:'Перемести этого ниндзя', e:'move', v:1, c:4}, {n:'Ниндзя-воин', p:3, a:'Перемести этого ниндзя', e:'move', v:1, c:2}, {n:'Ниндзя-мастер', p:4, a:'Уничтожь приспешника с силой ≤ 2', e:'destroy', v:2, c:2}, {n:'Теневой ниндзя', p:5, a:'Перемести этого ниндзя', e:'move', v:1, c:2}],
        actions: [{n:'Скрытный удар', a:'Уничтожь приспешника с силой ≤ 2', e:'destroy', v:2, c:4}, {n:'Быстрый побег', a:'Перемести своего приспешника', e:'move', v:1, c:4}, {n:'Ночная атака', a:'Уничтожь приспешника с силой ≤ 3', e:'destroy', v:3, c:2}]
    },
    aliens: { name: 'Пришельцы', icon: '👽', color: '#3498db',
        minions: [{n:'Разведчик', p:2, a:'Перемести чужого приспешника', e:'moveEnemy', v:1, c:4}, {n:'Воин', p:3, a:'Перемести чужого приспешника', e:'moveEnemy', v:1, c:2}, {n:'Командир', p:4, a:'Потяни 1 карту', e:'draw', v:1, c:2}, {n:'Властелин', p:5, a:'Перемести чужого приспешника', e:'moveEnemy', v:1, c:2}],
        actions: [{n:'Похищение', a:'Перемести чужого приспешника', e:'moveEnemy', v:1, c:4}, {n:'Телепортация', a:'Перемести своего приспешника', e:'move', v:1, c:4}, {n:'Луч дезинтеграции', a:'Уничтожь приспешника с силой ≤ 3', e:'destroy', v:3, c:2}]
    },
    tricksters: { name: 'Проказники', icon: '🃏', color: '#f39c12',
        minions: [{n:'Воришка', p:2, a:'Перемести чужого приспешника', e:'moveEnemy', v:1, c:4}, {n:'Хулиган', p:3, a:'Уничтожь приспешника с силой ≤ 2', e:'destroy', v:2, c:2}, {n:'Мошенник', p:4, a:'Потяни 1 карту', e:'draw', v:1, c:2}, {n:'Король проказников', p:5, a:'Перемести чужого приспешника', e:'moveEnemy', v:1, c:2}],
        actions: [{n:'Кража', a:'Перемести чужого приспешника', e:'moveEnemy', v:1, c:4}, {n:'Вандализм', a:'Уничтожь приспешника с силой ≤ 2', e:'destroy', v:2, c:4}, {n:'Хаос', a:'Потяни 2 карты', e:'draw', v:2, c:2}]
    },
    robots: { name: 'Роботы', icon: '🤖', color: '#95a5a6',
        minions: [{n:'Микробот', p:1, c:6}, {n:'Боевой робот', p:4, a:'Уничтожь приспешника с силой ≤ 2', e:'destroy', v:2, c:2}, {n:'Мегабот', p:6, c:2}],
        actions: [{n:'Ракетный залп', a:'Уничтожь приспешника с силой ≤ 2', e:'destroy', v:2, c:4}, {n:'Лазерный луч', a:'Уничтожь приспешника с силой ≤ 3', e:'destroy', v:3, c:4}, {n:'Перезарядка', a:'Потяни 2 карты', e:'draw', v:2, c:2}]
    }
};

const BASES_DATA = [
    { name: 'Оазис в джунглях', defense: 12, points: [5, 3, 2] },
    { name: 'Древний храм', defense: 15, points: [6, 4, 2] },
    { name: 'Забытое кладбище', defense: 18, points: [7, 5, 3] },
    { name: 'Подводный город', defense: 14, points: [5, 3, 2] },
    { name: 'Горная крепость', defense: 20, points: [8, 5, 3] }
];

// === ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ===
let peer = null;
let conn = null; // Для клиента
let connections = []; // Для хоста
let myId = null;
let isHost = false;
let gameState = null;
let selectedCardId = null;

// === ИНИЦИАЛИЗАЦИЯ P2P ===
function initPeer() {
    peer = new Peer(null, { debug: 2 });
    peer.on('open', (id) => {
        myId = id;
        console.log('My peer ID is: ' + id);
    });
    peer.on('connection', (c) => {
        if (isHost) {
            connections.push(c);
            c.on('data', (data) => handleHostData(data, c));
            c.on('close', () => {
                connections = connections.filter(x => x !== c);
                broadcastState();
            });
        }
    });
}

// === ЛОББИ ===
function createGame() {
    const name = document.getElementById('player-name').value || 'Хост';
    isHost = true;
    initPeer();
    
    // Ждем получения ID
    const checkId = setInterval(() => {
        if (myId) {
            clearInterval(checkId);
            document.getElementById('lobby-status').innerHTML = `
                <p>Игра создана! Отправьте этот код друзьям:</p>
                <div class="room-code">${myId}</div>
                <p>Ожидание игроков...</p>
            `;
            // Инициализация состояния игры
            gameState = {
                players: [{ id: myId, name: name, factions: [], deck: [], hand: [], discard: [], score: 0 }],
                bases: [],
                currentPlayerIndex: 0,
                phase: 'lobby',
                logs: ['Лобби создано. Ожидание игроков...']
            };
            renderLobby();
        }
    }, 500);
}

function joinGame() {
    const name = document.getElementById('player-name').value || 'Игрок';
    const hostId = document.getElementById('room-code-input').value.trim();
    if (!hostId) return alert('Введите код комнаты!');
    
    initPeer();
    const checkId = setInterval(() => {
        if (myId) {
            clearInterval(checkId);
            conn = peer.connect(hostId);
            conn.on('open', () => {
                conn.send({ type: 'join', name: name });
                document.getElementById('lobby-status').innerHTML = `<p>Подключено к хосту. Ожидание начала игры...</p>`;
            });
            conn.on('data', (data) => handleClientData(data));
        }
    }, 500);
}

// === ЛОГИКА ХОСТА ===
function handleHostData(data, senderConn) {
    if (data.type === 'join') {
        gameState.players.push({ id: senderConn.peer, name: data.name, factions: [], deck: [], hand: [], discard: [], score: 0 });
        gameState.logs.push(`${data.name} присоединился к игре.`);
        broadcastState();
    } else if (data.type === 'selectFactions') {
        const p = gameState.players.find(x => x.id === senderConn.peer);
        if (p) {
            p.factions = [data.f1, data.f2];
            gameState.logs.push(`${p.name} выбрал фракции.`);
            checkStartGame();
        }
    } else if (data.type === 'playCard') {
        if (gameState.players[gameState.currentPlayerIndex].id !== senderConn.peer) return;
        processPlayCard(senderConn.peer, data.cardId, data.baseIndex);
    } else if (data.type === 'endTurn') {
        if (gameState.players[gameState.currentPlayerIndex].id !== senderConn.peer) return;
        processEndTurn();
    }
}

function checkStartGame() {
    if (gameState.players.length >= 2 && gameState.players.every(p => p.factions.length === 2)) {
        gameState.phase = 'playing';
        gameState.bases = shuffle([...BASES_DATA]).slice(0, gameState.players.length + 1).map((b, i) => ({...b, id: i, minions: []}));
        
        gameState.players.forEach(p => {
            p.deck = createDeck(p.factions[0], p.factions[1]);
            p.hand = p.deck.splice(0, 5);
            p.score = 0;
            p.discard = [];
        });
        
        gameState.logs.push('🎮 Игра началась! Первый ход: ' + gameState.players[0].name);
        broadcastState();
    }
}

function processPlayCard(playerId, cardId, baseIndex) {
    const player = gameState.players.find(p => p.id === playerId);
    const cardIdx = player.hand.findIndex(c => c.uid === cardId);
    if (cardIdx === -1) return;
    const card = player.hand[cardIdx];

    if (card.type === 'minion') {
        player.hand.splice(cardIdx, 1);
        gameState.bases[baseIndex].minions.push({ ...card, ownerId: playerId });
        gameState.logs.push(`${player.name} разместил ${card.icon} ${card.n} на базе.`);
    } else if (card.type === 'action') {
        player.hand.splice(cardIdx, 1);
        player.discard.push(card);
        gameState.logs.push(`${player.name} сыграл действие: ${card.icon} ${card.n}`);
        
        // Упрощенная обработка действий для демо
        if (card.e === 'destroy') resolveDestroy(card.v);
        else if (card.e === 'draw') drawCards(player, card.v);
    }
    
    checkBases();
    broadcastState();
}

function processEndTurn() {
    const player = gameState.players[gameState.currentPlayerIndex];
    drawCards(player, 2);
    if (player.hand.length > 10) {
        const excess = player.hand.splice(0, player.hand.length - 10);
        player.discard.push(...excess);
        gameState.logs.push(`${player.name} сбросил лишние карты (лимит 10).`);
    }
    
    gameState.currentPlayerIndex = (gameState.currentPlayerIndex + 1) % gameState.players.length;
    gameState.logs.push(`➡️ Ход переходит к ${gameState.players[gameState.currentPlayerIndex].name}`);
    broadcastState();
}

function broadcastState() {
    const stateStr = JSON.stringify(gameState);
    connections.forEach(c => c.send({ type: 'state', state: gameState }));
    renderGame(); // Обновляем и у хоста
}

// === ЛОГИКА КЛИЕНТА ===
function handleClientData(data) {
    if (data.type === 'state') {
        gameState = data.state;
        renderGame();
        if (gameState.phase === 'lobby') renderLobby();
    }
}

// === ИГРОВАЯ ЛОГИКА (ОБЩАЯ) ===
function shuffle(array) { return array.sort(() => Math.random() - 0.5); }

function createDeck(f1, f2) {
    let deck = [];
    [f1, f2].forEach(fKey => {
        const f = FACTIONS[fKey];
        f.minions.forEach(m => { for(let i=0; i<m.c; i++) deck.push({...m, type:'minion', faction:fKey, name:f.name, icon:f.icon, color:f.color, uid:Math.random().toString(36).substr(2,9)}); });
        f.actions.forEach(a => { for(let i=0; i<a.c; i++) deck.push({...a, type:'action', faction:fKey, name:f.name, icon:f.icon, color:f.color, uid:Math.random().toString(36).substr(2,9)}); });
    });
    return shuffle(deck);
}

function drawCards(player, count) {
    for (let i = 0; i < count; i++) {
        if (player.deck.length === 0 && player.discard.length > 0) {
            player.deck = shuffle([...player.discard]);
            player.discard = [];
            gameState.logs.push(`${player.name} перетасовал сброс в колоду.`);
        }
        if (player.deck.length > 0) player.hand.push(player.deck.pop());
    }
}

function resolveDestroy(maxPower) {
    for (let base of gameState.bases) {
        const idx = base.minions.findIndex(m => m.p <= maxPower);
        if (idx !== -1) {
            const destroyed = base.minions.splice(idx, 1)[0];
            const owner = gameState.players.find(p => p.id === destroyed.ownerId);
            owner.discard.push(destroyed);
            gameState.logs.push(`💥 ${destroyed.n} уничтожен!`);
            return;
        }
    }
}

function checkBases() {
    for (let i = gameState.bases.length - 1; i >= 0; i--) {
        const base = gameState.bases[i];
        const totalPower = base.minions.reduce((sum, m) => sum + m.p, 0);
        
        if (totalPower >= base.defense) {
            gameState.logs.push(`⚠️ База "${base.name}" захвачена!`);
            const powers = {};
            base.minions.forEach(m => { powers[m.ownerId] = (powers[m.ownerId] || 0) + m.p; });
            
            const sorted = Object.entries(powers).sort((a, b) => b[1] - a[1]);
            sorted.forEach((entry, idx) => {
                if (idx < 3) {
                    const player = gameState.players.find(p => p.id === entry[0]);
                    const points = base.points[idx] || 0;
                    player.score += points;
                    gameState.logs.push(`🏆 ${player.name} получает ${points} очков! (Всего: ${player.score})`);
                }
            });
            
            base.minions.forEach(m => {
                const owner = gameState.players.find(p => p.id === m.ownerId);
                owner.discard.push(m);
            });
            
            gameState.bases.splice(i, 1);
            // Добавляем новую базу для демо (в реальной игре из колоды баз)
            if (gameState.bases.length < gameState.players.length + 1) {
                const newBase = BASES_DATA[Math.floor(Math.random() * BASES_DATA.length)];
                gameState.bases.push({...newBase, id: Date.now(), minions: []});
                gameState.logs.push(`🗺️ Открыта новая база: ${newBase.name}`);
            }
            
            const winner = gameState.players.find(p => p.score >= 15);
            if (winner) {
                gameState.phase = 'gameover';
                gameState.logs.push(`🎉 ${winner.name} ПОБЕДИЛ! 🎉`);
            }
        }
    }
}

// === РЕНДЕРИНГ ===
function renderLobby() {
    if (!isHost) return;
    const list = gameState.players.map(p => `<p>${p.name} ${p.factions.length === 2 ? '✅' : '...'}</p>`).join('');
    document.getElementById('lobby-status').innerHTML += `<div style="margin-top:20px; text-align:left;">${list}</div>`;
}

// Вызывается из HTML при выборе фракций (только для хоста пока, для простоты демо хост управляет всем, 
// но в идеале каждый шлет свой выбор. Для упрощения сделаем авто-выбор для демо или простой промпт)
function startGameHost() {
    // В полноценной версии здесь был бы UI выбора фракций для каждого.
    // Для демо-версии P2P мы автоматически назначим случайные фракции, если они не выбраны, чтобы игра началась
    const fKeys = Object.keys(FACTIONS);
    gameState.players.forEach(p => {
        if (p.factions.length === 0) {
            let f1 = fKeys[Math.floor(Math.random()*fKeys.length)];
            let f2 = fKeys[Math.floor(Math.random()*fKeys.length)];
            while(f1 === f2) f2 = fKeys[Math.floor(Math.random()*fKeys.length)];
            p.factions = [f1, f2];
        }
    });
    checkStartGame();
}

function renderGame() {
    if (!gameState) return;
    
    if (gameState.phase === 'lobby') {
        if (isHost) {
            document.getElementById('lobby-status').innerHTML += `<br><button onclick="startGameHost()" style="margin-top:20px; background:#27ae60;">🚀 Начать игру (случайные фракции для демо)</button>`;
        }
        return;
    }
    
    if (gameState.phase === 'gameover') {
        document.getElementById('lobby-screen').classList.remove('active');
        document.getElementById('game-screen').classList.remove('active');
        document.getElementById('victory-screen').classList.add('active');
        const winner = gameState.players.reduce((prev, current) => (prev.score > current.score) ? prev : current);
        document.getElementById('winner-name').textContent = winner.name + ' победил!';
        document.getElementById('final-scores').innerHTML = gameState.players.sort((a,b)=>b.score-a.score).map(p => `<p>${p.name}: ${p.score} очков</p>`).join('');
        return;
    }

    document.getElementById('lobby-screen').classList.remove('active');
    document.getElementById('game-screen').classList.add('active');
    
    const currentPlayer = gameState.players[gameState.currentPlayerIndex];
    document.getElementById('current-player-name').textContent = currentPlayer.name;
    document.getElementById('room-display').textContent = isHost ? `Вы хост. Код: ${myId}` : `Подключено к: ${myId}`;

    // Рендер баз
    const basesArea = document.getElementById('bases-area');
    basesArea.innerHTML = gameState.bases.map((base, idx) => {
        const totalPower = base.minions.reduce((sum, m) => sum + m.p, 0);
        const isCapturable = totalPower >= base.defense;
        const minionsHtml = base.minions.map(m => {
            const owner = gameState.players.find(p => p.id === m.ownerId);
            return `<div class="minion-slot" style="border-left: 3px solid ${m.color}">
                <span>${m.icon} ${m.n} (${m.p})</span>
                <span>${owner ? owner.name : '?'}</span>
            </div>`;
        }).join('');
        
        return `<div class="base-card ${isCapturable ? 'capturable' : ''}" onclick="playCard(${idx})">
            <h4 style="margin:0 0 10px 0;">${base.name}</h4>
            <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:10px;">
                <span>🛡️ ${base.defense}</span>
                <span style="color:${isCapturable ? '#ffd700' : '#fff'}">⚔️ ${totalPower}</span>
            </div>
            <div style="font-size:11px; color:#aaa; margin-bottom:10px;">Очки: ${base.points[0]} / ${base.points[1]} / ${base.points[2]}</div>
            ${minionsHtml}
        </div>`;
    }).join('');

    // Рендер руки текущего игрока
    const myPlayer = gameState.players.find(p => p.id === (isHost ? myId : (conn ? conn.peer : myId)));
    const handArea = document.getElementById('hand-area');
    document.getElementById('hand-count').textContent = myPlayer ? myPlayer.hand.length : 0;
    
    const isMyTurn = currentPlayer.id === (isHost ? myId : (conn ? conn.peer : myId));
    document.getElementById('btn-end-turn').disabled = !isMyTurn;

    if (myPlayer && isMyTurn) {
        handArea.innerHTML = myPlayer.hand.map(card => `
            <div class="card ${selectedCardId === card.uid ? 'selected' : ''}" 
                 style="background: linear-gradient(135deg, ${card.color}, #fff)"
                 onclick="selectCard('${card.uid}')">
                <span class="card-type">${card.type === 'minion' ? 'Присп.' : 'Действ.'}</span>
                <b>${card.icon} ${card.n}</b><br>
                ${card.type === 'minion' ? `Сила: ${card.p}` : 'Действие'}<br>
                <small style="color:#555;">${card.a || ''}</small>
            </div>
        `).join('');
    } else {
        handArea.innerHTML = '<p style="color:#aaa; width:100%; text-align:center;">Сейчас не ваш ход. Ожидайте...</p>';
    }

    // Рендер счета
    const scoresArea = document.getElementById('players-scores');
    scoresArea.innerHTML = gameState.players.map(p => `
        <div class="player-stat ${p.id === currentPlayer.id ? 'active' : ''}">
            <div style="display:flex; justify-content:space-between;">
                <b>${p.name}</b>
                <span style="color:#ffd700; font-size:18px;">${p.score} VP</span>
            </div>
            <div style="font-size:12px; color:#aaa; margin-top:5px;">
                В руке: ${p.hand.length} | В колоде: ${p.deck.length}
            </div>
        </div>
    `).join('');

    // Рендер лога
    document.getElementById('log').innerHTML = gameState.logs.map(l => `<div class="log-entry">${l}</div>`).join('');
}

function selectCard(uid) {
    selectedCardId = selectedCardId === uid ? null : uid;
    renderGame();
}

function playCard(baseIndex) {
    if (!selectedCardId) return;
    if (isHost) {
        processPlayCard(myId, selectedCardId, baseIndex);
    } else {
        conn.send({ type: 'playCard', cardId: selectedCardId, baseIndex: baseIndex });
    }
    selectedCardId = null;
}

function endTurn() {
    if (isHost) {
        processEndTurn();
    } else {
        conn.send({ type: 'endTurn' });
    }
}

// Запуск
initPeer();
</script>
</body>
</html>
